<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — PizarraCollab</title>
    <meta name="description" content="El ingreso de PizarraCollab es el de JPCONNECT, el pasaporte del ecosistema Fullscreen Code.">
    <link rel='stylesheet' href='css/style.css' />
</head>
<body>
    <!-- PizarraCollab NO tiene formulario de login propio (regla §0.6 del manual
         FSC): esta página es sólo un puente hacia el login unificado de
         JPCONNECT. El redirect lo hace js/auth.js, igual que en jpshadereditor y
         artedigitaldata; si el JS está bloqueado queda el link de abajo. -->
    <div class="auth-bridge">
        <h1>PizarraCollab</h1>
        <p>Te estamos llevando al ingreso del ecosistema…</p>
        <a id="loginDirecto" href="https://fullscreencode.com/jpconnect/login.html">Entrar con JPCONNECT</a>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
  <!-- botón FSC: solo el isotipo, abajo a la izquierda -->
  <script src="https://vps-4455523-x.dattaweb.com/fscauth/js/fsc-button.js?v=10"></script>
</body>
</html>
